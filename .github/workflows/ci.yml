name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang valgrind fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          python3 -m pip install --user clang-format==21.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Norm check
        run: make norm_check

      - name: Build
        run: make all -j

      - name: Run tests
        run: make tests_run -j
